# ============================================================
# n8n — deployed SEPARATELY from the app stack (../docker-compose.yml)
#
#   docker network create iconnect-network      # once (shared with the app stack)
#   cd /www/wwwroot/iconnect/n8n
#   cp .env.example .env && nano .env           # fill real values
#   docker compose up -d
#
# Verify n8n can reach the backends over the shared network:
#   docker exec -it iconnect-n8n wget -qO- http://woocommerce-wrapper:8081/health
# ============================================================

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: iconnect-n8n
    restart: always
    env_file: .env
    ports:
      # localhost-only ON PURPOSE. aaPanel's nginx terminates HTTPS and proxies here.
      # Docker publishes ports via its own iptables rules that BYPASS ufw — binding
      # 0.0.0.0 would expose n8n to the whole internet even though ufw blocks 5678.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - /opt/n8n_public_files:/mnt/shared_files
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - default           # reach `postgresql`
      - iconnect-network  # reach semantic-search:8080 / woocommerce-wrapper:8081

  postgresql:
    image: postgres:16-alpine
    container_name: iconnect-n8n-db
    restart: always
    env_file: .env
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - default           # internal only — NOT published, so no clash with Odoo's host :5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  n8n-data:         # holds workflows + the encryption key — BACK THIS UP
  postgresql-data:

networks:
  iconnect-network:
    external: true
